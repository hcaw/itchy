name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm test

  browser:
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Playwright is a test tool only: installed here for CI, never a dependency of Itchy itself.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - run: npm run check
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-screenshots
          path: test-output/
          retention-days: 14
