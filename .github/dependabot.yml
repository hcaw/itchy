# Keep GitHub Actions and the tooling up to date. openDAW is left out on purpose: it is upgraded by hand, one version
# per pull request, after reading its migration notes (see CLAUDE.md).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '@opendaw/*'
    groups:
      tooling:
        patterns: ['*']
