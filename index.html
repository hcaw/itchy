<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>Itchy — make music</title>
  <meta name="description" content="A free music-making toy for children aged 6–11. Tap the grid and a critter sings. No reading, no sign-up, no tracking.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Link previews (the card is rendered by npm run screenshots) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Itchy — make music">
  <meta property="og:description" content="A free music-making toy for children aged 6–11. Tap the grid and a critter sings.">
  <meta property="og:url" content="https://hcaw.github.io/itchy/">
  <meta property="og:image" content="https://hcaw.github.io/itchy/assets/social-card.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="The Itchy logo next to the app: a grid of colourful notes with friendly critters down the side.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" class="loading">
    <header id="top" aria-label="Controls"></header>
    <nav id="rail" aria-label="Critters"></nav>
    <main id="stage" aria-label="Music grid"></main>
    <section id="panel" aria-label="Sound and charms"></section>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Itchy needs JavaScript to make music.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
