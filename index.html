<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff8ee">
  <title>Itchy — make music</title>
  <meta name="description" content="A free music-making toy for children aged 6–11. Tap the grid and a critter sings. No reading, no sign-up, no tracking.">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Link previews (the card is rendered by npm run screenshots) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Itchy — make music">
  <meta property="og:description" content="A free music-making toy for children aged 6–11. Tap the grid and a critter sings.">
  <meta property="og:url" content="https://hcaw.github.io/itchy/">
  <meta property="og:image" content="https://hcaw.github.io/itchy/assets/social-card.png">
  <meta property="og:image:width" content="1280">
  <meta property="og:image:height" content="640">
  <meta property="og:image:alt" content="The Itchy logo next to the app: a grid of colourful notes with friendly critters down the side.">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preload" href="assets/fonts/nunito.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
  <!-- Cross-origin isolation for openDAW's engine. GitHub Pages can't send the COOP/COEP headers, so a service worker
       adds them, but only on devices that pass the same capability probe as src/audio/probe.js (kept identical by
       tests/probe.test.js), so other devices are never reloaded. Must stay classic scripts, before the module. -->
  <script>
    function itchyProbe() {
      try {
        return typeof AudioWorkletNode === 'function'
          && typeof Promise.withResolvers === 'function'
          && typeof WebAssembly === 'object'
          && WebAssembly.validate(new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 96, 0, 1, 123, 3, 2, 1, 0, 10, 10, 1, 8, 0, 65, 0, 253, 15, 253, 98, 11]));
      } catch (e) {
        return false;
      }
    }
    window.coi = {
      quiet: true,
      coepCredentialless: () => false, // Safari has no "credentialless", so every browser gets require-corp
      shouldRegister: () => !window.crossOriginIsolated && itchyProbe() && !/[?&]engine=native/.test(location.search),
      // WebKit now and then drops a reload made while the service worker starts up, leaving this page with its
      // scripts cancelled and nothing on screen. A page that is still here after a moment reloads again (3 times
      // at most); a reload that works replaces the page, and its timer with it.
      doReload: () => {
        let tries = 0;
        const reload = () => { if (tries++ < 4) { location.reload(); setTimeout(reload, 1500 * tries); } };
        reload();
      },
    };
    // WebKit also now and then fails every file the service worker fetches just after it starts, which would leave
    // a blank page. If one of the page's own scripts or stylesheets fails to load, reload (twice per tab at most).
    (function () {
      var key = 'itchy-load-retries', failed = false;
      function store(f) { try { return f(window.sessionStorage); } catch (e) { return null; } }
      document.addEventListener('error', function (e) {
        var el = e.target, url = el && (el.tagName === 'SCRIPT' ? el.src : el.tagName === 'LINK' ? el.href : '');
        if (failed || !url || new URL(url, location.href).origin !== location.origin) return;
        failed = true;
        var tries = Number(store(function (s) { return s.getItem(key); }) || 0);
        if (tries < 2 && store(function (s) { s.setItem(key, String(tries + 1)); return true; })) location.reload();
      }, true);
      window.addEventListener('load', function () { if (!failed) store(function (s) { s.removeItem(key); }); });
    })();
  </script>
  <script src="coi-serviceworker.js"></script>
</head>
<body>
  <div id="app" class="loading">
    <header id="top" aria-label="Controls"></header>
    <nav id="rail" aria-label="Critters"></nav>
    <main id="stage" aria-label="Music grid"></main>
    <section id="panel" aria-label="Sound and charms"></section>
  </div>
  <div id="overlay-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript>Itchy needs JavaScript to make music.</noscript>
  <script type="module" src="src/main.js"></script>
</body>
</html>
